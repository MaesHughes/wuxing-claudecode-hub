<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wuxing ClaudeCode Hub - Claude Code Extension Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      color: #1a1a1e;
      line-height: 1.6;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 40px 0;
      border-bottom: 1px solid #e0e0e5;
    }
    .header-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .logo {
      width: 48px;
      height: 48px;
    }
    h1 { font-size: 2.5em; margin-bottom: 10px; color: #1a1a1e; }
    .subtitle { color: #666; }

    /* Tabs Navigation */
    .tabs-nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 10px 20px;
      border: 1px solid #d0d0d5;
      border-radius: 8px;
      background: #ffffff;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover { background: #f0f0f5; }
    .tab-btn.active {
      background: #4a90d9;
      color: #ffffff;
      border-color: #4a90d9;
    }
    .tab-btn .coming-soon {
      font-size: 0.75em;
      opacity: 0.7;
    }

    /* Tab Content */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Coming Soon Page */
    .coming-soon-page {
      text-align: center;
      padding: 80px 40px;
    }
    .coming-soon-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }
    .coming-soon-title {
      font-size: 1.8em;
      font-weight: 600;
      margin-bottom: 15px;
      color: #1a1a1e;
    }
    .coming-soon-desc {
      font-size: 1.1em;
      color: #666;
      margin-bottom: 10px;
    }
    .coming-soon-version {
      color: #888;
      font-style: italic;
    }

    /* Search Box */
    .search-box {
      margin: 30px 0;
      display: flex;
      gap: 10px;
    }
    #searchInput {
      flex: 1;
      padding: 15px 20px;
      font-size: 16px;
      border: 1px solid #d0d0d5;
      border-radius: 8px;
      background: #ffffff;
      color: #1a1a1e;
    }
    #searchInput:focus { outline: none; border-color: #4a90d9; box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.1); }

    /* Categories */
    .categories {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .category-btn {
      padding: 8px 16px;
      border: 1px solid #d0d0d5;
      border-radius: 20px;
      background: #ffffff;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }
    .category-btn:hover { background: #4a90d9; color: #ffffff; border-color: #4a90d9; }
    .category-btn.active {
      background: #4a90d9;
      color: #ffffff;
      border-color: #4a90d9;
    }

    /* Grid */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
      align-items: stretch;
    }
    .skill-card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #e0e0e5;
      border-radius: 12px;
      padding: 20px;
      min-height: 220px;
      height: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .skill-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      border-color: #4a90d9;
    }
    .skill-name {
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: 10px;
      color: #1a1a1e;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.6em;
      max-height: 2.6em;
    }
    .skill-desc {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 15px;
      height: 66px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }
    .skill-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid #e0e0e5;
      font-size: 0.85em;
      color: #888;
    }
    .skill-footer {
      margin-top: auto;
    }
    .install-btn {
      padding: 8px 20px;
      background: #4a90d9;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .install-btn:hover { background: #3a7bc8; }
    .install-btn.installed { background: #2d6a4f; }
    .uninstall-btn {
      padding: 8px 16px;
      background: #dc3545;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85em;
      font-weight: 500;
    }
    .uninstall-btn:hover { background: #c82333; }
    .uninstall-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .button-group { display: flex; gap: 8px; align-items: center; }
    .status-installed { color: #2d6a4f; font-weight: 500; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .stats {
      text-align: center;
      color: #888;
      margin: 20px 0;
      font-size: 0.95em;
    }
    .section-title {
      font-size: 1.5em;
      font-weight: 600;
      margin: 30px 0 20px 0;
      color: #1a1a1e;
      padding-bottom: 10px;
      border-bottom: 2px solid #e0e0e5;
    }
    .uninstall-info {
      margin-top: 12px;
      padding: 10px 12px;
      background: #fff8e1;
      border: 1px solid #ffd54f;
      border-radius: 6px;
      font-size: 0.8em;
      color: #666;
    }
    .uninstall-info-title {
      font-weight: 600;
      color: #f57c00;
      margin-bottom: 6px;
    }
    .uninstall-info-path {
      font-family: 'Consolas', 'Monaco', monospace;
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      word-break: break-all;
    }

    /* Verified Badge */
    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.75em;
      font-weight: 600;
      margin-left: 8px;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }
    .verified-badge svg {
      width: 14px;
      height: 14px;
    }
    .official-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7em;
      font-weight: 600;
      margin-left: 6px;
    }
    /* Official Dev Badge - 官方开发专属 */
    .official-dev-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.75em;
      font-weight: 600;
      margin-left: 6px;
      box-shadow: 0 2px 8px rgba(245, 39, 17, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .official-dev-badge svg {
      width: 14px;
      height: 14px;
    }
    .skill-card.verified {
      border: 2px solid transparent;
      background: linear-gradient(#ffffff, #ffffff) padding-box,
                  linear-gradient(135deg, #667eea 0%, #764ba2 100%) border-box;
    }
    .skill-card.verified:hover {
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
    }
    /* Official Dev Card Style */
    .skill-card.official-dev {
      border: 2px solid transparent;
      background: linear-gradient(#ffffff, #ffffff) padding-box,
                  linear-gradient(135deg, #f5af19 0%, #f12711 100%) border-box;
      position: relative;
    }
    .skill-card.official-dev::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
      border-radius: 14px;
      z-index: -1;
      opacity: 0.1;
    }
    .skill-card.official-dev:hover {
      box-shadow: 0 8px 24px rgba(245, 39, 17, 0.3);
    }

    /* Language Switcher */
    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 5px;
    }
    .lang-btn {
      padding: 6px 12px;
      border: 1px solid #d0d0d5;
      border-radius: 6px;
      background: #ffffff;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      font-size: 0.9em;
    }
    .lang-btn:hover {
      background: #f0f0f5;
    }
    .lang-btn.active {
      background: #4a90d9;
      color: #ffffff;
      border-color: #4a90d9;
    }
  </style>
</head>
<body>
  <!-- Language Switcher -->
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="zh" onclick="setLanguage('zh')">中文</button>
    <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
  </div>

  <div class="container">
    <header>
      <div class="header-content">
        <img src="logo.png" alt="Wuxing Logo" class="logo">
        <h1>Wuxing ClaudeCode Hub</h1>
      </div>
      <p class="subtitle">Claude Code Extension Manager - Skills, Commands, MCP</p>
    </header>

    <!-- Tabs Navigation -->
    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="skills">
        📦 Skills
      </button>
      <button class="tab-btn" data-tab="commands">
        📝 Commands
      </button>
      <button class="tab-btn" data-tab="mcp">
        🔌 MCP
      </button>
      <button class="tab-btn" data-tab="agents">
        🤖 Agents
      </button>
    </div>

    <!-- Skills Tab -->
    <div id="skills-tab" class="tab-content active">
      <section>
        <h2 class="section-title">📦 已安装的 Skills</h2>
        <div id="installedSkills" class="skills-grid">
          <div class="loading">检测中...</div>
        </div>
      </section>

      <section>
        <h2 class="section-title">🛒 Skills 市场</h2>
        <div class="search-box">
          <input type="text" id="skillsSearchInput" placeholder="搜索 skills...">
        </div>
        <div class="categories" id="skillsCategories"></div>
        <div class="stats" id="skillsStats"></div>
        <div class="skills-grid" id="skillsMarketplaceGrid">
          <div class="loading">加载中...</div>
        </div>
      </section>
    </div>

    <!-- Commands Tab -->
    <div id="commands-tab" class="tab-content">
      <section>
        <h2 class="section-title">📝 已安装的 Commands</h2>
        <div id="installedCommands" class="skills-grid">
          <div class="loading">检测中...</div>
        </div>
      </section>

      <section>
        <h2 class="section-title">🛒 Commands 市场</h2>
        <div class="search-box">
          <input type="text" id="commandsSearchInput" placeholder="搜索 commands...">
        </div>
        <div class="categories" id="commandsCategories"></div>
        <div class="stats" id="commandsStats"></div>
        <div class="skills-grid" id="commandsMarketplaceGrid">
          <div class="loading">加载中...</div>
        </div>
      </section>
    </div>

    <!-- MCP Tab -->
    <div id="mcp-tab" class="tab-content">
      <section>
        <h2 class="section-title">🔌 已安装的 MCP Servers</h2>
        <div id="installedMcp" class="skills-grid">
          <div class="loading">检测中...</div>
        </div>
      </section>

      <section>
        <h2 class="section-title">🛒 MCP 市场</h2>
        <div class="search-box">
          <input type="text" id="mcpSearchInput" placeholder="搜索 MCP servers...">
        </div>
        <div class="categories" id="mcpCategories"></div>
        <div class="stats" id="mcpStats"></div>
        <div class="skills-grid" id="mcpMarketplaceGrid">
          <div class="loading">加载中...</div>
        </div>
      </section>
    </div>

    <!-- Agents Tab -->
    <div id="agents-tab" class="tab-content">
      <section>
        <h2 class="section-title">🤖 已安装的 Agents</h2>
        <div id="installedAgents" class="skills-grid">
          <div class="loading">检测中...</div>
        </div>
      </section>

      <section>
        <h2 class="section-title">🛒 Agents 市场</h2>
        <div class="search-box">
          <input type="text" id="agentsSearchInput" placeholder="搜索 agents...">
        </div>
        <div class="categories" id="agentsCategories"></div>
        <div class="stats" id="agentsStats"></div>
        <div class="skills-grid" id="agentsMarketplaceGrid">
          <div class="loading">加载中...</div>
        </div>
      </section>
    </div>

  </div>

  <script>
    // State
    let allSkills = [];
    let allCommands = [];
    let currentSkillsCategory = 'all';
    let currentCommandsCategory = 'all';
    let currentLanguage = 'zh';

    // ==================== Translations ====================
    const translations = {
      zh: {
        // Tabs
        tabSkills: '📦 Skills',
        tabCommands: '📝 Commands',
        tabMCP: '🔌 MCP',
        tabAgents: '🤖 Agents',
        // Section titles
        installedSkills: '📦 已安装的 Skills',
        skillsMarketplace: '🛒 Skills 市场',
        installedCommands: '📝 已安装的 Commands',
        commandsMarketplace: '🛒 Commands 市场',
        installedMCP: '🔌 已安装的 MCP Servers',
        mcpMarketplace: '🛒 MCP 市场',
        installedAgents: '🤖 已安装的 Agents',
        agentsMarketplace: '🛒 Agents 市场',
        // Common
        all: '全部',
        searching: '搜索中...',
        loading: '加载中...',
        detecting: '检测中...',
        noneInstalled: '暂无已安装的 {type}',
        noneAvailable: '没有可安装的 {type}',
        total: '共 {count} 个 {type}',
        // Buttons
        install: '安装',
        configure: '配置',
        uninstall: '卸载',
        installing: '安装中...',
        // Status
        installed: '✓ 已安装',
        // Badges
        officialDev: '官方开发',
        verified: '官方认证',
        custom: '自定义',
        requiresAuth: '需认证',
        // Types
        typeLocal: '本地进程',
        typeHTTP: 'HTTP',
        // Placeholders
        searchSkills: '搜索 skills...',
        searchCommands: '搜索 commands...',
        searchMCP: '搜索 MCP servers...',
        searchAgents: '搜索 agents...',
        // Messages
        success: '✅',
        error: '❌',
        // Official Dev Badge
        officialDevDesc: '官方开发专属'
      },
      en: {
        // Tabs
        tabSkills: '📦 Skills',
        tabCommands: '📝 Commands',
        tabMCP: '🔌 MCP',
        tabAgents: '🤖 Agents',
        // Section titles
        installedSkills: '📦 Installed Skills',
        skillsMarketplace: '🛒 Skills Marketplace',
        installedCommands: '📝 Installed Commands',
        commandsMarketplace: '🛒 Commands Marketplace',
        installedMCP: '🔌 Installed MCP Servers',
        mcpMarketplace: '🛒 MCP Marketplace',
        installedAgents: '🤖 Installed Agents',
        agentsMarketplace: '🛒 Agents Marketplace',
        // Common
        all: 'All',
        searching: 'Searching...',
        loading: 'Loading...',
        detecting: 'Detecting...',
        noneInstalled: 'No installed {type}',
        noneAvailable: 'No available {type}',
        total: 'Total {count} {type}',
        // Buttons
        install: 'Install',
        configure: 'Configure',
        uninstall: 'Uninstall',
        installing: 'Installing...',
        // Status
        installed: '✓ Installed',
        // Badges
        officialDev: 'Official Dev',
        verified: 'Verified',
        custom: 'Custom',
        requiresAuth: 'Auth Required',
        // Types
        typeLocal: 'Local Process',
        typeHTTP: 'HTTP',
        // Placeholders
        searchSkills: 'Search skills...',
        searchCommands: 'Search commands...',
        searchMCP: 'Search MCP servers...',
        searchAgents: 'Search agents...',
        // Messages
        success: '✅',
        error: '❌',
        // Official Dev Badge
        officialDevDesc: 'Official Development'
      }
    };

    function t(key, params = {}) {
      let text = translations[currentLanguage][key] || key;
      Object.keys(params).forEach(param => {
        text = text.replace(`{${param}}`, params[param]);
      });
      return text;
    }

    function setLanguage(lang) {
      currentLanguage = lang;

      // Update language buttons
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      // Re-render all content
      renderAllContent();
    }

    function renderAllContent() {
      // Re-render each section with new language
      renderInstalledSkills();
      renderSkillsMarketplace();
      renderInstalledCommands();
      renderCommandsMarketplace();
      renderInstalledMcp();
      renderMcpMarketplace();
      renderInstalledAgents();
      renderAgentsMarketplace();

      // Update placeholders
      document.getElementById('skillsSearchInput').placeholder = t('searchSkills');
      document.getElementById('commandsSearchInput').placeholder = t('searchCommands');
      document.getElementById('mcpSearchInput').placeholder = t('searchMCP');
      document.getElementById('agentsSearchInput').placeholder = t('searchAgents');
    }

    // ==================== Tabs Navigation ====================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabName = btn.dataset.tab;

        // Update active button
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Update active content
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(`${tabName}-tab`).classList.add('active');

        // Update URL hash
        location.hash = tabName;
      });
    });

    // Restore tab from URL hash
    if (location.hash) {
      const tabName = location.hash.slice(1);
      const tabBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
      if (tabBtn) tabBtn.click();
    }

    // ==================== Skills ====================
    async function loadSkills() {
      const response = await fetch('/api/skills');
      allSkills = await response.json();

      // Check installation status for each skill
      for (const skill of allSkills) {
        try {
          const statusRes = await fetch(`/api/skills/${skill.id}/status?scope=global`);
          const statusData = await statusRes.json();
          skill.installed = statusData.installed;
        } catch {
          skill.installed = false;
        }
      }

      renderInstalledSkills();
      renderSkillsCategories();
      renderSkillsMarketplace();
    }

    function renderInstalledSkills() {
      const installed = allSkills.filter(s => s.installed);
      const container = document.getElementById('installedSkills');

      if (installed.length === 0) {
        container.innerHTML = '<div class="loading">暂无已安装的 skills</div>';
        return;
      }

      container.innerHTML = installed.map(skill => {
        const skillPath = getSkillPath(skill.id);
        return `
          <div class="skill-card">
            <div class="skill-name">${skill.name}</div>
            <div class="skill-desc">${skill.description}</div>
            <div class="skill-footer">
              <div class="skill-meta">
                <span class="status-installed">✓ 已安装</span>
                <button class="uninstall-btn" onclick="uninstallSkill('${skill.id}', '${skill.name}')">
                  卸载
                </button>
              </div>
              <div class="uninstall-info">
                <div class="uninstall-info-title">📍 路径: ${skillPath}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderSkillsCategories() {
      const categories = ['all', ...new Set(allSkills.map(s => s.category))];
      const container = document.getElementById('skillsCategories');

      container.innerHTML = categories.map(cat => `
        <button class="category-btn ${cat === currentSkillsCategory ? 'active' : ''}"
                onclick="setSkillsCategory('${cat}')">
          ${cat === 'all' ? '全部' : cat} (${cat === 'all' ? allSkills.length : allSkills.filter(s => s.category === cat).length})
        </button>
      `).join('');

      document.getElementById('skillsStats').textContent = `共 ${allSkills.length} 个 skills`;
    }

    function renderSkillsMarketplace() {
      const search = document.getElementById('skillsSearchInput').value.toLowerCase();
      let filtered = allSkills.filter(s => !s.installed);

      if (currentSkillsCategory !== 'all') {
        filtered = filtered.filter(s => s.category === currentSkillsCategory);
      }

      if (search) {
        filtered = filtered.filter(s =>
          s.name.toLowerCase().includes(search) ||
          s.description.toLowerCase().includes(search)
        );
      }

      const grid = document.getElementById('skillsMarketplaceGrid');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading">没有可安装的 skills</div>';
        return;
      }

      grid.innerHTML = filtered.map(skill => `
        <div class="skill-card">
          <div class="skill-name">${skill.name}</div>
          <div class="skill-desc">${skill.description}</div>
          <div class="skill-footer">
            <div class="skill-meta">
              <span>${skill.author}</span>
              <button class="install-btn" onclick="installSkill('${skill.id}')">安装</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setSkillsCategory(category) {
      currentSkillsCategory = category;
      renderSkillsCategories();
      renderSkillsMarketplace();
    }

    function getSkillPath(skillId) {
      return '点击卸载按钮打开文件夹';
    }

    async function installSkill(skillId) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '安装中...';

      try {
        const response = await fetch(`/api/skills/${skillId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scope: 'global' })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          await loadSkills();
        } else {
          btn.textContent = '失败: ' + (result.error || '未知错误');
          btn.disabled = false;
        }
      } catch (error) {
        console.error('Install error:', error);
        btn.textContent = '错误: ' + error.message;
        btn.disabled = false;
      }
    }

    async function uninstallSkill(skillId, skillName) {
      try {
        const response = await fetch(`/api/skills/${skillId}/open-folder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scope: 'global' })
        });

        const result = await response.json();

        if (result.success) {
          setTimeout(() => {
            loadSkills();
          }, 2000);
        } else {
          alert('❌ 打开文件夹失败: ' + result.error);
        }
      } catch (error) {
        alert('❌ 错误: ' + error.message);
      }
    }

    document.getElementById('skillsSearchInput').addEventListener('input', renderSkillsMarketplace);

    // ==================== Commands ====================
    async function loadCommands() {
      const response = await fetch('/api/commands');
      allCommands = await response.json();

      // Check installation status for each command
      for (const cmd of allCommands) {
        try {
          const statusRes = await fetch(`/api/commands/${cmd.id}/status?scope=global`);
          const statusData = await statusRes.json();
          cmd.installed = statusData.installed;
        } catch {
          cmd.installed = false;
        }
      }

      renderInstalledCommands();
      renderCommandsCategories();
      renderCommandsMarketplace();
    }

    function renderInstalledCommands() {
      const container = document.getElementById('installedCommands');
      container.innerHTML = '<div class="loading">加载中...</div>';

      // Fetch all installed commands from ~/.claude/commands/
      fetch('/api/commands/installed?scope=global')
        .then(res => res.json())
        .then(installed => {
          if (installed.length === 0) {
            container.innerHTML = '<div class="loading">暂无已安装的 commands</div>';
            return;
          }

          container.innerHTML = installed.map(cmd => `
            <div class="skill-card">
              <div class="skill-name">${cmd.name}</div>
              <div class="skill-desc">${cmd.description}</div>
              <div class="skill-footer">
                <div class="skill-meta">
                  <span class="status-installed">✓ 已安装</span>
                  ${!cmd.isFromMarketplace ? '<span style="color:#888;font-size:0.8em">第三方</span>' : ''}
                  <button class="uninstall-btn" onclick="uninstallCommand('${cmd.id}')">
                    卸载
                  </button>
                </div>
                <div class="uninstall-info">
                  <div class="uninstall-info-title">📝 触发: ${cmd.trigger}</div>
                  <div class="uninstall-info-path">📂 ${cmd.filePath}</div>
                </div>
              </div>
            </div>
          `).join('');
        })
        .catch(err => {
          console.error('Error loading installed commands:', err);
          container.innerHTML = '<div class="loading">加载失败</div>';
        });
    }

    function renderCommandsCategories() {
      const categories = ['all', ...new Set(allCommands.map(c => c.category))];
      const container = document.getElementById('commandsCategories');

      container.innerHTML = categories.map(cat => `
        <button class="category-btn ${cat === currentCommandsCategory ? 'active' : ''}"
                onclick="setCommandsCategory('${cat}')">
          ${cat === 'all' ? '全部' : cat} (${cat === 'all' ? allCommands.length : allCommands.filter(c => c.category === cat).length})
        </button>
      `).join('');

      document.getElementById('commandsStats').textContent = `共 ${allCommands.length} 个 commands`;
    }

    function renderCommandsMarketplace() {
      const search = document.getElementById('commandsSearchInput').value.toLowerCase();
      let filtered = allCommands.filter(c => !c.installed);

      if (currentCommandsCategory !== 'all') {
        filtered = filtered.filter(c => c.category === currentCommandsCategory);
      }

      if (search) {
        filtered = filtered.filter(c =>
          c.name.toLowerCase().includes(search) ||
          c.description.toLowerCase().includes(search)
        );
      }

      const grid = document.getElementById('commandsMarketplaceGrid');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading">没有可安装的 commands</div>';
        return;
      }

      grid.innerHTML = filtered.map(cmd => `
        <div class="skill-card">
          <div class="skill-name">${cmd.name}</div>
          <div class="skill-desc">${cmd.description}</div>
          <div class="skill-footer">
            <div class="skill-meta">
              <span>${cmd.trigger}</span>
              <button class="install-btn" onclick="installCommand('${cmd.id}')">安装</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setCommandsCategory(category) {
      currentCommandsCategory = category;
      renderCommandsCategories();
      renderCommandsMarketplace();
    }

    async function installCommand(commandId) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '安装中...';

      try {
        const response = await fetch(`/api/commands/${commandId}/install`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scope: 'global' })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          await loadCommands();
        } else {
          btn.textContent = '失败: ' + (result.error || '未知错误');
          btn.disabled = false;
        }
      } catch (error) {
        console.error('Install error:', error);
        btn.textContent = '错误: ' + error.message;
        btn.disabled = false;
      }
    }

    async function uninstallCommand(commandId) {
      try {
        const response = await fetch('/api/commands/open-folder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ commandId: commandId, scope: 'global' })
        });

        const result = await response.json();

        if (result.success) {
          // 刷新状态（用户删除后可能需要刷新）
          setTimeout(() => {
            renderInstalledCommands();
          }, 2000);
        } else {
          alert('❌ 打开文件夹失败: ' + result.error);
        }
      } catch (error) {
        alert('❌ 错误: ' + error.message);
      }
    }

    document.getElementById('commandsSearchInput').addEventListener('input', renderCommandsMarketplace);

    // ==================== MCP Servers ====================
    let allMcp = [];
    let currentMcpCategory = 'all';

    async function loadMcp() {
      const response = await fetch('/api/mcp');
      allMcp = await response.json();

      // Check installation status for each MCP server
      for (const mcp of allMcp) {
        try {
          const statusRes = await fetch(`/api/mcp/${mcp.id}/status?scope=user`);
          const statusData = await statusRes.json();
          mcp.installed = statusData.installed;
        } catch {
          mcp.installed = false;
        }
      }

      renderInstalledMcp();
      renderMcpCategories();
      renderMcpMarketplace();
    }

    function renderInstalledMcp() {
      const container = document.getElementById('installedMcp');
      container.innerHTML = '<div class="loading">加载中...</div>';

      // Fetch all installed MCP servers
      fetch('/api/mcp/installed?scope=user')
        .then(res => res.json())
        .then(installed => {
          if (installed.length === 0) {
            container.innerHTML = '<div class="loading">暂无已安装的 MCP servers</div>';
            return;
          }

          // 排序：官方开发 > 官方认证 > 其他
          installed.sort((a, b) => {
            const marketplaceMcpA = allMcp.find(m => m.id === a.id);
            const marketplaceMcpB = allMcp.find(m => m.id === b.id);
            const aIsOfficial = marketplaceMcpA && marketplaceMcpA.isOfficial ? 2 :
                               (marketplaceMcpA && (marketplaceMcpA.verified || marketplaceMcpA.official) ? 1 : 0);
            const bIsOfficial = marketplaceMcpB && marketplaceMcpB.isOfficial ? 2 :
                               (marketplaceMcpB && (marketplaceMcpB.verified || marketplaceMcpB.official) ? 1 : 0);
            return bIsOfficial - aIsOfficial;
          });

          container.innerHTML = installed.map(mcp => {
            const typeLabel = mcp.type === 'stdio' ? '本地进程' : mcp.type === 'http' ? 'HTTP' : mcp.type;
            // Check if this is a verified/official MCP from marketplace
            const marketplaceMcp = allMcp.find(m => m.id === mcp.id);
            const isOfficial = marketplaceMcp && marketplaceMcp.isOfficial;
            const isVerified = marketplaceMcp && (marketplaceMcp.verified || marketplaceMcp.official);

            // 官方开发专属标记 (金色)
            const officialDevBadge = isOfficial ? `
              <span class="official-dev-badge">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                官方开发
              </span>
            ` : '';

            // 官方认证标记 (紫色) - 但不是官方开发的
            const verifiedBadge = !isOfficial && isVerified ? `
              <span class="verified-badge">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
                官方认证
              </span>
            ` : '';

            const cardClass = isOfficial ? 'skill-card official-dev' :
                              isVerified ? 'skill-card verified' : 'skill-card';

            return `
              <div class="${cardClass}">
                <div class="skill-name">${mcp.name}${officialDevBadge}${verifiedBadge}</div>
                <div class="skill-desc">${mcp.description || '无描述'}</div>
                <div class="skill-footer">
                  <div class="skill-meta">
                    <span class="status-installed">✓ 已安装</span>
                    <span style="color:#888;font-size:0.8em">${typeLabel}</span>
                    ${!mcp.fromMarketplace ? '<span style="color:#888;font-size:0.8em">自定义</span>' : ''}
                    <button class="uninstall-btn" onclick="uninstallMcp()">
                      卸载
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        })
        .catch(err => {
          console.error('Error loading installed MCP:', err);
          container.innerHTML = '<div class="loading">加载失败</div>';
        });
    }

    function renderMcpCategories() {
      const categories = ['all', ...new Set(allMcp.map(m => m.category))];
      const container = document.getElementById('mcpCategories');

      container.innerHTML = categories.map(cat => `
        <button class="category-btn ${cat === currentMcpCategory ? 'active' : ''}"
                onclick="setMcpCategory('${cat}')">
          ${cat === 'all' ? '全部' : cat} (${cat === 'all' ? allMcp.length : allMcp.filter(m => m.category === cat).length})
        </button>
      `).join('');

      document.getElementById('mcpStats').textContent = `共 ${allMcp.length} 个 MCP servers`;
    }

    function renderMcpMarketplace() {
      const search = document.getElementById('mcpSearchInput').value.toLowerCase();
      let filtered = allMcp.filter(m => !m.installed);

      if (currentMcpCategory !== 'all') {
        filtered = filtered.filter(m => m.category === currentMcpCategory);
      }

      if (search) {
        filtered = filtered.filter(m =>
          m.name.toLowerCase().includes(search) ||
          m.description.toLowerCase().includes(search) ||
          (m.tags && m.tags.some(tag => tag.toLowerCase().includes(search)))
        );
      }

      // 排序：官方开发 > 官方认证 > 其他，然后按热度排序
      filtered.sort((a, b) => {
        const aIsOfficial = a.isOfficial ? 2 : (a.verified || a.official ? 1 : 0);
        const bIsOfficial = b.isOfficial ? 2 : (b.verified || b.official ? 1 : 0);
        if (aIsOfficial !== bIsOfficial) {
          return bIsOfficial - aIsOfficial;
        }
        return (b.popularity || 0) - (a.popularity || 0);
      });

      const grid = document.getElementById('mcpMarketplaceGrid');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading">没有可安装的 MCP servers</div>';
        return;
      }

      grid.innerHTML = filtered.map(mcp => {
        const typeLabel = mcp.type === 'stdio' ? '本地进程' : mcp.type === 'http' ? 'HTTP' : mcp.type;
        const authBadge = mcp.requiresAuth ? '<span style="background:#ff9800;color:#fff;padding:2px 6px;border-radius:4px;font-size:0.7em;margin-left:6px">需认证</span>' : '';

        // 官方开发专属标记 (金色)
        const officialDevBadge = mcp.isOfficial ? `
          <span class="official-dev-badge">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
            </svg>
            官方开发
          </span>
        ` : '';

        // 官方认证标记 (紫色) - 但不是官方开发的
        const verifiedBadge = !mcp.isOfficial && (mcp.verified || mcp.official) ? `
          <span class="verified-badge">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
            官方认证
          </span>
        ` : '';

        const cardClass = mcp.isOfficial ? 'skill-card official-dev' :
                          (mcp.verified || mcp.official) ? 'skill-card verified' : 'skill-card';

        return `
          <div class="${cardClass}">
            <div class="skill-name">${mcp.name}${authBadge}${officialDevBadge}${verifiedBadge}</div>
            <div class="skill-desc">${mcp.description}</div>
            <div class="skill-footer">
              <div class="skill-meta">
                <span style="color:#888;font-size:0.85em">${typeLabel}</span>
                <button class="install-btn" onclick="installMcp('${mcp.id}')">配置</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function setMcpCategory(category) {
      currentMcpCategory = category;
      renderMcpCategories();
      renderMcpMarketplace();
    }

    async function installMcp(mcpId) {
      const mcp = allMcp.find(m => m.id === mcpId);
      if (!mcp) return;

      const message = `
要安装 "${mcp.name}" MCP server，请按照以下步骤操作：

1. 打开配置文件所在文件夹
2. 编辑 ~/.claude.json 文件
3. 在 "mcpServers" 部分添加以下配置：

${JSON.stringify(mcp.config, null, 2)}

4. 保存文件后，重启 Claude Code
${mcp.requiresAuth ? '\n⚠️ 此服务器需要认证，请配置相关的 API Key 或环境变量。' : ''}

点击"确定"打开配置文件夹，取消放弃安装。
      `;

      if (confirm(message)) {
        try {
          const response = await fetch('/api/mcp/open-config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scope: 'user' })
          });

          const result = await response.json();

          if (result.success) {
            alert('✅ ' + result.message + '\n\n请按照上述说明手动配置 MCP server。');
          } else {
            alert('❌ 打开配置失败: ' + result.error);
          }
        } catch (error) {
          alert('❌ 错误: ' + error.message);
        }
      }
    }

    async function uninstallMcp() {
      if (confirm('要卸载 MCP server，请手动编辑 ~/.claude.json 文件，删除对应的配置项。\n\n点击"确定"打开配置文件夹。')) {
        try {
          const response = await fetch('/api/mcp/open-config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scope: 'user' })
          });

          const result = await response.json();

          if (result.success) {
            alert('✅ ' + result.message);
            setTimeout(() => {
              renderInstalledMcp();
            }, 2000);
          } else {
            alert('❌ 打开配置失败: ' + result.error);
          }
        } catch (error) {
          alert('❌ 错误: ' + error.message);
        }
      }
    }

    document.getElementById('mcpSearchInput').addEventListener('input', renderMcpMarketplace);

    // ==================== Agents ====================
    let allAgents = [];
    let currentAgentsCategory = 'all';

    async function loadAgents() {
      const response = await fetch('/api/agents');
      allAgents = await response.json();

      // Check installation status for each agent
      for (const agent of allAgents) {
        try {
          const statusRes = await fetch(`/api/agents/${agent.id}/status?scope=user`);
          const statusData = await statusRes.json();
          agent.installed = statusData.installed;
        } catch {
          agent.installed = false;
        }
      }

      renderInstalledAgents();
      renderAgentsCategories();
      renderAgentsMarketplace();
    }

    function renderInstalledAgents() {
      const container = document.getElementById('installedAgents');
      container.innerHTML = '<div class="loading">加载中...</div>';

      // Fetch all installed agents
      fetch('/api/agents/installed?scope=user')
        .then(res => res.json())
        .then(installed => {
          if (installed.length === 0) {
            container.innerHTML = '<div class="loading">暂无已安装的 agents</div>';
            return;
          }

          container.innerHTML = installed.map(agent => {
            return `
              <div class="skill-card">
                <div class="skill-name">${agent.name}</div>
                <div class="skill-desc">${agent.description}</div>
                <div class="skill-footer">
                  <div class="skill-meta">
                    <span class="status-installed">✓ 已安装</span>
                    <span style="color:#888;font-size:0.8em">${agent.category}</span>
                    ${!agent.fromMarketplace ? '<span style="color:#888;font-size:0.8em">自定义</span>' : ''}
                    <button class="uninstall-btn" onclick="uninstallAgent()">
                      卸载
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        })
        .catch(err => {
          console.error('Error loading installed agents:', err);
          container.innerHTML = '<div class="loading">加载失败</div>';
        });
    }

    function renderAgentsCategories() {
      const categories = ['all', ...new Set(allAgents.map(a => a.category))];
      const container = document.getElementById('agentsCategories');

      container.innerHTML = categories.map(cat => `
        <button class="category-btn ${cat === currentAgentsCategory ? 'active' : ''}"
                onclick="setAgentsCategory('${cat}')">
          ${cat === 'all' ? '全部' : cat} (${cat === 'all' ? allAgents.length : allAgents.filter(a => a.category === cat).length})
        </button>
      `).join('');

      document.getElementById('agentsStats').textContent = `共 ${allAgents.length} 个 agents`;
    }

    function renderAgentsMarketplace() {
      const search = document.getElementById('agentsSearchInput').value.toLowerCase();
      let filtered = allAgents.filter(a => !a.installed);

      if (currentAgentsCategory !== 'all') {
        filtered = filtered.filter(a => a.category === currentAgentsCategory);
      }

      if (search) {
        filtered = filtered.filter(a =>
          a.name.toLowerCase().includes(search) ||
          a.description.toLowerCase().includes(search) ||
          (a.tags && a.tags.some(tag => tag.toLowerCase().includes(search)))
        );
      }

      const grid = document.getElementById('agentsMarketplaceGrid');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading">没有可安装的 agents</div>';
        return;
      }

      grid.innerHTML = filtered.map(agent => {
        return `
          <div class="skill-card">
            <div class="skill-name">${agent.name}</div>
            <div class="skill-desc">${agent.description}</div>
            <div class="skill-footer">
              <div class="skill-meta">
                <span style="color:#888;font-size:0.85em">${agent.type}</span>
                <button class="install-btn" onclick="installAgent('${agent.id}')">配置</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function setAgentsCategory(category) {
      currentAgentsCategory = category;
      renderAgentsCategories();
      renderAgentsMarketplace();
    }

    async function installAgent(agentId) {
      const agent = allAgents.find(a => a.id === agentId);
      if (!agent) return;

      const message = `
要配置 "${agent.name}" Agent，请按照以下步骤操作：

1. 打开 Agents 文件夹
2. 在文件夹中创建一个新的 .md 文件（例如：${agent.id}.md）
3. 在文件中添加以下内容：

---
name: ${agent.name}
description: ${agent.description}
category: ${agent.category}
author: ${agent.author}
---

# ${agent.name} 的提示词

请在此处添加 agent 的具体指令和行为...

4. 保存文件后，重启 Claude Code
5. 在 Claude Code 中使用 \\invoke ${agent.id} 来调用此 agent

点击"确定"打开 Agents 文件夹，取消放弃配置。
      `;

      if (confirm(message)) {
        try {
          const response = await fetch('/api/agents/open-folder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scope: 'user' })
          });

          const result = await response.json();

          if (result.success) {
            alert('✅ ' + result.message + '\n\n请按照上述说明手动创建 agent 文件。');
          } else {
            alert('❌ 打开文件夹失败: ' + result.error);
          }
        } catch (error) {
          alert('❌ 错误: ' + error.message);
        }
      }
    }

    async function uninstallAgent() {
      if (confirm('要卸载 Agent，请手动删除 ~/.claude/agents/ 目录中对应的 .md 文件。\n\n点击"确定"打开 Agents 文件夹。')) {
        try {
          const response = await fetch('/api/agents/open-folder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scope: 'user' })
          });

          const result = await response.json();

          if (result.success) {
            alert('✅ ' + result.message);
            setTimeout(() => {
              renderInstalledAgents();
            }, 2000);
          } else {
            alert('❌ 打开文件夹失败: ' + result.error);
          }
        } catch (error) {
          alert('❌ 错误: ' + error.message);
        }
      }
    }

    document.getElementById('agentsSearchInput').addEventListener('input', renderAgentsMarketplace);

    // ==================== Initialize ====================
    loadSkills();
    loadCommands();
    loadMcp();
    loadAgents();
  </script>
</body>
</html>
